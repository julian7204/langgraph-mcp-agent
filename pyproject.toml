[project]
name = "mcp-agent"
version = "0.1.0"
description = "LangGraph agent for MCP servers with human approval for destructive tools, OAuth, and a deterministic eval suite"
readme = "README.md"
authors = [
    { name = "julian7204", email = "117853623+julian7204@users.noreply.github.com" }
]
requires-python = ">=3.12"
license = "MIT"
keywords = ["langgraph", "mcp", "agents", "evals", "llm"]
dependencies = [
    "langchain-anthropic>=1.7,<2",
    "langchain-core>=1.6,<2",
    "langchain-mcp-adapters>=0.3,<0.4",
    "langchain-ollama>=1.1.0",
    "langgraph>=1.2,<2",
    "mcp>=1.30.0",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "typer>=0.27.3",
]

[project.scripts]
mcp-agent = "mcp_agent.cli:app"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.0",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF"]
ignore = ["RUF001"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src"]
